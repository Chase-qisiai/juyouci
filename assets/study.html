<body><main>
<header><div><div class="eyebrow">JUYOUCI / 剧有词</div><h1 id="title">剧有词</h1><p class="muted">看一集，学几句。</p></div><span class="badge">独立 HTML · 随时学习</span></header>
<section id="empty-library" class="empty" hidden><h2>学习器里还没有词库</h2><p>请让剧有词把剧集词条加入这个学习网页，再重新生成文件。</p></section>
<div id="workspace" hidden>
<div class="toolbar" aria-label="学习器设置"><label>选择词库 <select id="deck-select" aria-label="选择词库"></select></label><label>练习方式 <select id="practice-mode" aria-label="练习方式"><option value="flashcard">两阶段自评（默认）</option><option value="typed">输入英文</option></select></label></div>
<section id="deck-empty" class="empty" hidden><h2>这个词库还没有词条</h2><p>选择其他词库，或让剧有词为这一集添加词条。</p></section>
<div id="deck-content">

<nav aria-label="页面模式"><button id="study-tab" aria-pressed="true">学习与回忆</button><button id="list-tab" aria-pressed="false">词汇总览</button></nav>
<section id="study"><div class="toolbar"><label>练习范围 <select id="filter"><option value="unlearned">继续学习</option><option value="again">需要再练</option><option value="all">全部复习</option></select></label><button id="shuffle">打乱顺序</button></div>
<div class="card"><div class="eyebrow" id="position"></div><div class="answer" id="answer-block"><div class="target-label" id="target-label">本次要学</div><h2 class="word-target" id="target"></h2><span class="ipa" id="ipa"></span><p class="muted" id="meaning"></p><p id="translation"></p></div><p class="recall-prompt" id="prompt"></p><p class="sentence" id="sentence"></p>
<div class="actions" id="learn-actions"><button class="primary" id="start">学过了，稍后考我</button><button id="speak">朗读原句</button></div>
<div class="actions" id="self-actions" hidden><button class="primary" id="reveal">核对答案</button><button id="self-speak">朗读原句</button></div>
<div class="actions" id="ratings" hidden><button id="again">没想起来</button><button class="primary" id="known">想起来了</button></div>
<div id="typed-actions" hidden><label class="target-label" for="answer-input" id="answer-label">根据中文提示，输入英文</label><div class="actions"><input id="answer-input" class="answer-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="feedback"><button class="primary" id="check">检查答案</button><button id="give-up">看答案，再练</button></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="continue" hidden>继续下一词 →</button></div></div>

<section id="list" hidden><input id="search" type="search" aria-label="搜索词汇" placeholder="搜索词汇、释义或台词…"><p class="muted" id="results"></p><div id="words"></div></section>

</div>
</main><script type="application/json" id="vocab-library">__VOCAB_LIBRARY__</script><script>
'use strict';
const LIBRARY = JSON.parse(document.getElementById('vocab-library').textContent);
const $ = id => document.getElementById(id);
const preferenceKey = 'series-vocab:preferences:v1';
const validDecks = LIBRARY && LIBRARY.schema_version === 1 && Array.isArray(LIBRARY.decks)
  ? LIBRARY.decks.filter(deck => deck && typeof deck.title === 'string' && typeof deck.deck_id === 'string' && Array.isArray(deck.cards))
  : [];
let preferences = { practiceMode: 'flashcard', deckId: '' };
try {
  const saved = JSON.parse(localStorage.getItem(preferenceKey) || 'null');
  if (saved && typeof saved === 'object') {
    if (saved.practiceMode === 'typed' || saved.practiceMode === 'flashcard') preferences.practiceMode = saved.practiceMode;
    if (typeof saved.deckId === 'string') preferences.deckId = saved.deckId;
  }
} catch (_) {}
let D = null, cardById = new Map(), ids = new Set(), progress = {}, queue = [];
let practiceMode = preferences.practiceMode, pageMode = 'study', revealed = false;
const progressKey = deckId => 'series-vocab:v2:' + deckId;
const legacyProgressKey = deckId => 'series-vocab:v1:' + deckId;

function notify(message) { $('notice').textContent = message; }
function savePreferences() {
  preferences.practiceMode = practiceMode;
  preferences.deckId = D ? D.deck_id : '';
  try { localStorage.setItem(preferenceKey, JSON.stringify(preferences)); }
  catch (_) { notify('浏览器未允许保存偏好；当前打开期间仍可切换练习方式。'); }
}
function cleanProgress(value, migrateLegacy = false) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw Error('进度格式不正确');
  const clean = {};
  for (const [id, state] of Object.entries(value)) {
    if (!ids.has(id)) continue;
    if (!['known', 'again', 'studied', 'meaning'].includes(state)) throw Error('进度状态不正确');
    clean[id] = migrateLegacy && state === 'known' ? 'studied' : state;
  }
  return clean;
}
function loadProgress() {
  progress = {};
  if (!D) return;
  try {
    const saved = localStorage.getItem(progressKey(D.deck_id));
    const legacy = saved ? null : localStorage.getItem(legacyProgressKey(D.deck_id));
    if (saved) progress = cleanProgress(JSON.parse(saved));
    else if (legacy) { progress = cleanProgress(JSON.parse(legacy), true); saveProgress(); }
  } catch (_) { notify('无法读取本地进度；这次仍可学习，请用“导出进度”保存。'); }
}
function saveProgress() {
  if (!D) return;
  try { localStorage.setItem(progressKey(D.deck_id), JSON.stringify(progress)); }
  catch (_) { notify('浏览器未允许保存进度；请用“导出进度”备份。'); }
}
function updateStats() {
  $('total').textContent = D ? D.cards.length : 0;
  $('learned').textContent = D ? D.cards.filter(card => progress[card.id] === 'known').length : 0;
  $('remaining').textContent = D ? D.cards.filter(card => progress[card.id] !== 'known').length : 0;
  $('learned-label').textContent = practiceMode === 'typed' ? '本轮答对' : '本轮记住';
}
function currentTask() { return queue[0] || null; }
function currentCard() { return queue.length && D ? cardById.get(queue[0].id) : null; }
function enqueue(task) { queue.splice(Math.min(3, queue.length), 0, task); }
function renderSentence(card, blank) {
  const host = $('sentence'); host.replaceChildren();
  let offset = 0;
  for (const [start, end] of card.target_spans || []) {
    host.append(document.createTextNode(card.sentence.slice(offset, start)));
    const mark = document.createElement('mark');
    if (blank) mark.className = 'blank';
    mark.textContent = blank ? '________' : card.sentence.slice(start, end);
    host.append(mark); offset = end;
  }
  host.append(document.createTextNode(card.sentence.slice(offset)));
}
function setVisible(id, visible) { $(id).hidden = !visible; }
function render() {
  updateStats();
  const task = currentTask(), card = currentCard(), phase = task && task.phase;
  const active = !!card;
  revealed = false;
  setVisible('answer-block', phase === 'learn');
  setVisible('target-label', phase === 'learn');
  setVisible('learn-actions', phase === 'learn' && active);
  setVisible('self-actions', (phase === 'meaning' || (phase === 'cloze' && practiceMode === 'flashcard')) && active);
  setVisible('ratings', false);
  setVisible('typed-actions', phase === 'cloze' && practiceMode === 'typed' && active);
  $('speak').disabled = !active;
  $('self-speak').disabled = !active;
  $('start').disabled = !active;
  if (!active) {
    const noDueAgain = D && D.cards.length && $('filter').value === 'again';
    $('position').textContent = D && D.cards.length ? (noDueAgain ? '没有待重练词条' : '本组练习完成') : '词库为空';
    $('target').textContent = '';
    $('prompt').textContent = noDueAgain ? '当前没有标记为“需要再练”的词。可以切换到“全部复习”继续。' : D && D.cards.length ? '休息一下吧。之后可以选择“全部复习”再练。' : '这个词库还没有词条。';
    $('sentence').textContent = noDueAgain ? '这一组没有需要重练的词。' : D && D.cards.length ? '本轮练习完成。' : '';
    $('translation').textContent = '';
    setVisible('answer-block', false); setVisible('target-label', false);
    setVisible('learn-actions', false); setVisible('self-actions', false);
    setVisible('typed-actions', false);
    return;
  }
  const phaseLabels = { learn: '01 · 学习新词', meaning: '02 · 回忆词义', cloze: '03 · 回想英文' };
  $('position').textContent = phaseLabels[phase] + ' · 队列剩余 ' + queue.length + ' 项';
  $('target').textContent = phase === 'cloze' ? card.meaning : card.term;
  $('ipa').textContent = card.ipa;
  $('meaning').textContent = card.meaning;
  $('translation').textContent = card.translation;
  if (phase === 'learn') {
    $('prompt').textContent = '看词义，再结合原句理解。准备好后，稍后会考你。';
    renderSentence(card, false);
  } else if (phase === 'meaning') {
    $('prompt').textContent = '标出的词或短语在这句话中是什么意思？先在心里作答，再核对答案。';
    renderSentence(card, false);
  } else {
    $('prompt').textContent = card.meaning + '：根据中文意思，回想空格处的英文（按原句形式）。';
    renderSentence(card, true);
  }
  $('reveal').textContent = '核对答案';
  $('answer-input').value = '';
  $('answer-input').disabled = false;
  $('check').hidden = false; $('check').disabled = false;
  $('continue').hidden = true; $('feedback').textContent = ''; $('feedback').className = 'feedback';
  if (phase === 'cloze' && practiceMode === 'typed') requestAnimationFrame(() => $('answer-input').focus({ preventScroll: true }));
}
function normalizeAnswer(value) {
  return value.normalize('NFKC').toLocaleLowerCase().replace(/[’‘]/g, "'").replace(/[\p{P}\p{S}]/gu, ' ').replace(/\s+/g, ' ').trim();
}
function reveal() {
  const task = currentTask();
  if (!task || (task.phase !== 'meaning' && !(task.phase === 'cloze' && practiceMode === 'flashcard'))) return;
  revealed = true; $('target').textContent = currentCard().term; setVisible('answer-block', true); setVisible('ratings', true); setVisible('self-actions', false);
  if (task.phase === 'cloze') renderSentence(currentCard(), false);
}
function study() {
  if (currentTask()?.phase !== 'learn') return;
  const task = queue.shift(); progress[task.id] = 'studied';
  enqueue({ id: task.id, phase: 'meaning' }); saveProgress(); render();
}
function rate(value) {
  const task = currentTask(), card = currentCard();
  if (!revealed || !task || !card) return;
  if (value === 'again') {
    progress[task.id] = 'again';
    queue.shift(); enqueue({ id: task.id, phase: 'meaning' });
  } else if (task.phase === 'meaning') {
    progress[task.id] = 'meaning';
    queue.shift(); enqueue({ id: task.id, phase: 'cloze' });
  } else {
    progress[task.id] = 'known'; queue.shift();
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  saveProgress(); render(); if (pageMode === 'list') list();
}
function checkAnswer() {
  const task = currentTask(), card = currentCard();
  if (!task || task.phase !== 'cloze' || practiceMode !== 'typed') return;
  const response = normalizeAnswer($('answer-input').value);
  if (!response) {
    $('feedback').textContent = '先输入答案，或点击“看答案，再练”。';
    $('feedback').className = 'feedback retry'; $('answer-input').focus(); return;
  }
  const correct = card.answers.map(normalizeAnswer).includes(response);
  $('answer-input').disabled = true; $('check').hidden = true; $('continue').hidden = false;
  $('target').textContent = card.term; setVisible('answer-block', true);
  if (correct) {
    progress[task.id] = 'known';
    $('feedback').textContent = '答对了：' + card.term; $('feedback').className = 'feedback good';
  } else {
    progress[task.id] = 'again';
    $('feedback').textContent = '这次没想起来。稍后再练一次。'; $('feedback').className = 'feedback retry';
    enqueue({ id: task.id, phase: 'cloze' });
  }
  saveProgress(); updateStats();
}
function giveUp() {
  const task = currentTask(), card = currentCard();
  if (!task || task.phase !== 'cloze' || practiceMode !== 'typed') return;
  $('answer-input').disabled = true; $('check').hidden = true; $('continue').hidden = false;
  $('target').textContent = card.term; setVisible('answer-block', true); progress[task.id] = 'again';
  $('feedback').textContent = '答案：' + card.term + '。稍后再练一次。'; $('feedback').className = 'feedback retry';
  enqueue({ id: task.id, phase: 'cloze' }); saveProgress(); updateStats();
}
function continueNext() { if (!currentTask()) return; queue.shift(); render(); }
function rebuild() {
  if (!D) return;
  const filter = $('filter').value;
  const cards = D.cards.filter(card => {
    const state = progress[card.id];
    if (filter === 'again') return state === 'again';
    if (filter === 'unlearned') return state !== 'known';
    return true;
  });
  queue = cards.map(card => ({
    id: card.id,
    phase: !progress[card.id] ? 'learn' : progress[card.id] === 'meaning' ? 'cloze' : 'meaning',
  }));
  render();
}
function list() {
  if (!D) return;
  const query = $('search').value.trim().toLocaleLowerCase();
  const rows = D.cards.filter(card => [card.term, card.meaning, card.sentence, card.translation].join(' ').toLocaleLowerCase().includes(query));
  $('results').textContent = '找到 ' + rows.length + ' 个词条';
  $('words').replaceChildren();
  for (const card of rows) {
    const article = document.createElement('article'); article.className = 'word';
    const top = document.createElement('div'); top.className = 'word-top';
    const term = document.createElement('strong'); term.textContent = card.term;
    const status = document.createElement('span'); status.className = 'hint';
    status.textContent = progress[card.id] === 'known' ? (practiceMode === 'typed' ? '本轮答对' : '本轮记住') : progress[card.id] === 'again' ? '需要再练' : progress[card.id] ? '练习中' : '未学习';
    top.append(term, status); article.append(top);
    for (const [content, className] of [[card.ipa, 'muted'], [card.meaning, ''], [card.sentence, 'example'], [card.translation, 'muted']]) {
      const p = document.createElement('p'); p.textContent = content; p.className = className; article.append(p);
    }
    $('words').append(article);
  }
}
function switchPageMode(nextMode) {
  pageMode = nextMode;
  $('study').hidden = pageMode !== 'study'; $('list').hidden = pageMode !== 'list';
  $('study-tab').setAttribute('aria-pressed', pageMode === 'study'); $('list-tab').setAttribute('aria-pressed', pageMode === 'list');
  if (pageMode === 'list') list();
}
function speak(buttonId) {
  if (!('speechSynthesis' in window)) { notify('当前浏览器不支持朗读，学习仍可使用。'); return; }
  const card = currentCard(); if (!card) return;
  speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(card.sentence);
  utterance.lang = 'en-US'; utterance.rate = .85;
  utterance.onerror = () => notify('朗读暂不可用，请检查设备语音或网络。');
  speechSynthesis.speak(utterance);
}
function setDeck(deckId) {
  D = validDecks.find(deck => deck.deck_id === deckId) || validDecks[0] || null;
  if (!D) return;
  cardById = new Map(D.cards.map(card => [card.id, card])); ids = new Set(cardById.keys());
  $('title').textContent = D.title || '剧有词学习器';
  document.title = (D.title || '剧有词学习器') + ' · 剧有词';
  const profile = [D.language, D.exam_target, D.level_target].filter(Boolean).join(' · ');
  $('profile').textContent = profile ? `词汇范围：${profile}${D.selection_basis ? ' · ' + D.selection_basis : ''}` : '';
  $('note').textContent = D.note || '';
  $('source-list').replaceChildren();
  for (const source of D.sources || []) {
    const p = document.createElement('p');
    if (/^https?:\/\//i.test(source)) {
      const a = document.createElement('a'); a.href = source; a.textContent = source;
      a.target = '_blank'; a.rel = 'noopener noreferrer'; p.append(a);
    } else p.textContent = source;
    $('source-list').append(p);
  }
  $('filter').value = 'unlearned'; $('search').value = '';
  loadProgress();
  const empty = D.cards.length === 0;
  $('deck-empty').hidden = !empty; $('deck-content').hidden = empty;
  if (!empty) { switchPageMode('study'); rebuild(); list(); }
  savePreferences();
}

if (!validDecks.length) {
  $('empty-library').hidden = false; $('title').textContent = '剧有词学习器';
} else {
  $('workspace').hidden = false;
  for (const deck of validDecks) {
    const option = document.createElement('option'); option.value = deck.deck_id; option.textContent = deck.title; $('deck-select').append(option);
  }
  const initialDeck = validDecks.some(deck => deck.deck_id === preferences.deckId) ? preferences.deckId : validDecks[0].deck_id;
  $('deck-select').value = initialDeck; $('practice-mode').value = practiceMode;
  $('deck-select').onchange = () => setDeck($('deck-select').value);
  $('practice-mode').onchange = () => {
    practiceMode = $('practice-mode').value; savePreferences(); rebuild();
    if (pageMode === 'list') list();
  };
  $('study-tab').onclick = () => switchPageMode('study'); $('list-tab').onclick = () => switchPageMode('list');
  $('search').oninput = list; $('filter').onchange = rebuild;
  $('shuffle').onclick = () => {
    for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    render();
  };
  $('reveal').onclick = reveal; $('start').onclick = study;
  $('again').onclick = () => rate('again'); $('known').onclick = () => rate('known');
  $('check').onclick = checkAnswer; $('give-up').onclick = giveUp; $('continue').onclick = continueNext;
  $('answer-input').oninput = () => { $('feedback').textContent = ''; $('feedback').className = 'feedback'; };
  $('answer-input').onkeydown = event => {
    if (event.key !== 'Enter') return; event.preventDefault();
    if ($('continue').hidden) checkAnswer(); else continueNext();
  };
  $('speak').onclick = () => speak('speak'); $('self-speak').onclick = () => speak('self-speak');
  $('export').onclick = () => {
    const blob = new Blob([JSON.stringify({ version: 2, deck_id: D.deck_id, progress }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = 'vocab-progress-' + D.deck_id.replace(/[^a-z0-9_-]+/gi, '-') + '.json'; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000); notify('已导出当前词库的学习进度。');
  };
  $('import').onclick = () => $('file').click();
  $('file').onchange = async () => {
    const file = $('file').files[0]; if (!file) return;
    try {
      if (file.size > 2000000) throw Error('文件过大');
      const data = JSON.parse(await file.text());
      if (![1, 2].includes(data.version) || data.deck_id !== D.deck_id) throw Error('这份进度不属于当前词库');
      const restored = cleanProgress(data.progress, data.version === 1);
      if (!confirm('导入会替换当前词库的学习进度，继续吗？')) return;
      progress = restored; saveProgress(); rebuild(); list(); notify('进度已导入。');
    } catch (error) { notify('导入失败：' + error.message); }
    finally { $('file').value = ''; }
  };
  $('reset').onclick = () => {
    if (!confirm('确定清除当前词库的学习进度吗？')) return;
    progress = {}; saveProgress(); rebuild(); list(); notify('已重置当前词库进度。');
  };
  document.addEventListener('keydown', event => {
    if (pageMode !== 'study' || event.ctrlKey || event.metaKey || event.altKey || event.repeat || ['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(event.target.tagName)) return;
    if (event.key === ' ' && !$('reveal').hidden) { event.preventDefault(); reveal(); }
    if (event.key === '1' && !$('ratings').hidden) rate('again');
    if (event.key === '2' && !$('ratings').hidden) rate('known');
  });
  setDeck(initialDeck);
}
</script></body></html>
