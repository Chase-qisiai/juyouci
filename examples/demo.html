<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剧有词 · 学习卡</title>
<style>
:root{--bg:#f4f3ed;--ink:#213e39;--muted:#687772;--line:#d8dfd6;--green:#235a47;--soft:#e5ecdf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:38px 28px 64px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(26px,4vw,40px);letter-spacing:-1px;margin:6px 0}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.badge{border:1px solid var(--line);border-radius:30px;padding:6px 13px;font-size:12px;white-space:nowrap}.stats{display:flex;gap:28px;margin:24px 0}.stats strong{font-size:28px;margin-right:8px}nav,.toolbar,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button,select{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d99945;outline-offset:3px}.primary,button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}.toolbar{justify-content:space-between;margin:22px 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 40px;min-height:370px;box-shadow:0 12px 35px #213e3906}.sentence{font-family:Georgia,serif;font-size:clamp(25px,4vw,36px);line-height:1.5;margin:28px 0;color:#193e33}.answer{border-top:1px solid var(--line);margin:22px 0;padding-top:18px}.term{font-size:22px;font-weight:650}.ipa{font-size:16px;color:var(--muted);font-weight:400;margin-left:12px}.actions{margin-top:24px}.bottom{justify-content:space-between;margin-top:18px;display:flex;gap:12px;align-items:center}.hint{font-size:12px;color:var(--muted)}input[type=search]{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:white;margin:22px 0}.word{background:white;border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:12px}.word-top{display:flex;justify-content:space-between;gap:12px}.word p{overflow-wrap:anywhere}.word .example{font-family:Georgia,serif;font-size:20px}footer{margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}footer .actions{margin-top:12px}#notice{min-height:24px;color:#855220;font-size:14px}#source-list{overflow-wrap:anywhere}a{color:var(--green)}[hidden]{display:none!important}@media(max-width:620px){main{padding:24px 16px}header{display:block}.badge{display:inline-block;margin-top:10px}.card{padding:22px;min-height:360px}.stats{gap:18px}.stats strong{font-size:23px}.bottom{align-items:flex-start;flex-direction:column}.actions button{flex:1}.word{padding:16px}}
</style></head>
<body><main>
<header><div><div class="eyebrow">JUYOUCI / 剧有词</div><h1 id="title"></h1><p class="muted">看一集，学几句。</p></div><span class="badge">独立 HTML · 随时学习</span></header>
<div class="stats" aria-label="学习统计"><div><strong id="total">0</strong>词条</div><div><strong id="learned">0</strong>已掌握</div><div><strong id="remaining">0</strong>待学习</div></div>
<nav aria-label="页面模式"><button id="study-tab" aria-pressed="true">闪卡练习</button><button id="list-tab" aria-pressed="false">词汇总览</button></nav>
<section id="study"><div class="toolbar"><label>练习范围 <select id="filter"><option value="all">全部词条</option><option value="unlearned">未掌握</option><option value="again">再练一次</option></select></label><button id="shuffle">打乱顺序</button></div>
<div class="card"><div class="eyebrow" id="position"></div><p class="sentence" id="sentence"></p><p class="muted" id="prompt">试着说出这句台词的意思。</p><div class="answer" id="answer" hidden><div><span class="term" id="term"></span><span class="ipa" id="ipa"></span></div><p id="meaning"></p><p id="translation"></p></div><div class="actions"><button class="primary" id="reveal">显示答案</button><button id="speak">朗读原句</button></div><div class="actions" id="ratings" hidden><button id="again">再练一次</button><button class="primary" id="known">已经掌握</button></div></div>
<div class="bottom"><div class="actions" style="margin:0"><button id="prev">← 上一张</button><button id="next">下一张 →</button></div><span class="hint">空格翻卡 · ← → 切换 · 显示答案后按 1 再练 / 2 掌握</span></div></section>
<section id="list" hidden><input id="search" type="search" aria-label="搜索词汇" placeholder="搜索词汇、释义或台词…"><p class="muted" id="results"></p><div id="words"></div></section>
<footer><div id="notice" role="status" aria-live="polite"></div><p class="hint">进度保存在当前浏览器。换浏览器、移动文件或清理数据前，请导出备份。朗读使用设备语音，声音及离线可用性取决于浏览器。</p><div class="actions"><button id="export">导出进度</button><button id="import">导入进度</button><button id="reset">重置进度</button><input type="file" id="file" accept="application/json,.json" hidden></div><p class="muted" id="note"></p><details><summary class="hint">内容来源</summary><div id="source-list"></div></details></footer>
</main><script type="application/json" id="vocab-data">{"title": "剧有词 · 交互体验", "deck_id": "demo:original-examples:v1:zh", "cards": [{"term": "figure out", "meaning": "弄明白；找到办法", "ipa": "/ˈfɪɡjər aʊt/", "sentence": "We can figure out the schedule after lunch.", "translation": "午饭后我们可以把时间安排弄清楚。", "id": "009069c64ced7c1404c4"}, {"term": "hold off", "meaning": "暂缓", "ipa": "/hoʊld ɔːf/", "sentence": "Let’s hold off on ordering until everyone arrives.", "translation": "等大家到齐再点餐吧。", "id": "2e0662d041733b83df16"}, {"term": "run into", "meaning": "偶然遇见", "ipa": "/rʌn ˈɪntuː/", "sentence": "I didn’t expect to run into my neighbor at the museum.", "translation": "我没想到会在博物馆偶遇邻居。", "id": "2dd1a3740d3a9b7c611d"}, {"term": "pull off", "meaning": "成功做到困难的事", "ipa": "/pʊl ɔːf/", "sentence": "With a little practice, we might pull off this performance.", "translation": "稍加练习，我们也许就能完成这场演出。", "id": "95220caed37961bd3108"}, {"term": "on the fence", "meaning": "犹豫不决", "ipa": "/ɑːn ðə fens/", "sentence": "I’m still on the fence about taking the evening class.", "translation": "我还在犹豫要不要上晚课。", "id": "9bbe89b1e27b011dbb46"}, {"term": "catch up", "meaning": "了解近况；叙旧", "ipa": "/kætʃ ʌp/", "sentence": "Let’s catch up over coffee this weekend.", "translation": "这周末我们喝杯咖啡叙叙旧吧。", "id": "e3e9a18529abec6f7f9c"}, {"term": "turn down", "meaning": "拒绝", "ipa": "/tɜːrn daʊn/", "sentence": "She had to turn down the invitation because of work.", "translation": "她因为工作不得不拒绝邀请。", "id": "25705e44338d06e4bacf"}, {"term": "give it a shot", "meaning": "试一试", "ipa": "/ɡɪv ɪt ə ʃɑːt/", "sentence": "The recipe looks tricky, but I’ll give it a shot.", "translation": "这道菜看着不好做，不过我想试一试。", "id": "523bc5975b8ce72785cc"}], "sources": ["原创演示句，仅展示学习页功能，不属于任何真实剧集。"], "note": "演示版 · 8 个原创例句。正式使用时会从你指定剧集的真实字幕中选词。"}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('vocab-data').textContent), $=id=>document.getElementById(id);
const key='series-vocab:v1:'+D.deck_id, ids=new Set(D.cards.map(c=>c.id));
let progress={}, queue=[],index=0,revealed=false,mode='study';
function notify(s){$('notice').textContent=s;}
function cleanProgress(p){if(!p||typeof p!=='object'||Array.isArray(p))throw Error('进度格式不正确');const out={};for(const [id,v] of Object.entries(p)){if(!ids.has(id))continue;if(v!=='known'&&v!=='again')throw Error('进度状态不正确');out[id]=v;}return out;}
try{const saved=localStorage.getItem(key);if(saved)progress=cleanProgress(JSON.parse(saved));}catch(e){notify('无法读取本地进度；本次仍可学习，请使用导出进度保存。');}
function save(){try{localStorage.setItem(key,JSON.stringify(progress));}catch(e){notify('浏览器未允许保存进度，请点击“导出进度”备份。');}}
function stats(){$('total').textContent=D.cards.length;const n=D.cards.filter(c=>progress[c.id]==='known').length;$('learned').textContent=n;$('remaining').textContent=D.cards.length-n;}
function matches(c){return $('filter').value==='all'||($('filter').value==='unlearned'?progress[c.id]!=='known':progress[c.id]==='again');}
function rebuild(){queue=D.cards.filter(matches);index=0;render();}
function render(){stats();revealed=false;$('answer').hidden=true;$('ratings').hidden=true;const c=queue[index];for(const id of ['reveal','speak'])$(id).disabled=!c;$('prev').disabled=!c||index===0;$('next').disabled=!c||index>=queue.length-1;$('reveal').textContent='显示答案';$('prompt').hidden=!c;
if(!c){$('position').textContent='练习完成';$('sentence').textContent='这一组已经学完了。换个范围继续吧。';return;}
$('position').textContent=`CARD ${String(index+1).padStart(2,'0')} / ${String(queue.length).padStart(2,'0')} · ${progress[c.id]==='known'?'已掌握':progress[c.id]==='again'?'再练一次':'待学习'}`;
for(const f of ['sentence','term','ipa','meaning','translation'])$(f).textContent=c[f];}
function reveal(){if(!queue[index])return;revealed=!revealed;$('answer').hidden=!revealed;$('ratings').hidden=!revealed;$('reveal').textContent=revealed?'收起答案':'显示答案';}
function move(n){if('speechSynthesis'in window)speechSynthesis.cancel();index=Math.max(0,Math.min(queue.length-1,index+n));render();}
function rate(value){if(!revealed||!queue[index])return;const c=queue[index];progress[c.id]=value;save();if(!matches(c)){queue.splice(index,1);index=Math.min(index,Math.max(0,queue.length-1));}else if(index<queue.length-1){index++;}render();}
function list(){const q=$('search').value.trim().toLocaleLowerCase();const rows=D.cards.filter(c=>[c.term,c.meaning,c.sentence,c.translation].join(' ').toLocaleLowerCase().includes(q));$('results').textContent=`找到 ${rows.length} 个词条`;$('words').replaceChildren();for(const c of rows){const el=document.createElement('article');el.className='word';const top=document.createElement('div');top.className='word-top';const term=document.createElement('strong');term.textContent=c.term;const status=document.createElement('span');status.className='hint';status.textContent=progress[c.id]==='known'?'已掌握':progress[c.id]==='again'?'再练一次':'待学习';top.append(term,status);el.append(top);for(const [txt,cls]of [[c.ipa,'muted'],[c.meaning,''],[c.sentence,'example'],[c.translation,'muted']]){const p=document.createElement('p');p.textContent=txt;p.className=cls;el.append(p);}$('words').append(el);}}
function switchMode(m){mode=m;$('study').hidden=m!=='study';$('list').hidden=m!=='list';$('study-tab').setAttribute('aria-pressed',m==='study');$('list-tab').setAttribute('aria-pressed',m==='list');if(m==='list')list();}
$('title').textContent=D.title;document.title=D.title+' · 剧有词';$('note').textContent=D.note;
for(const s of D.sources){const p=document.createElement('p');if(/^https?:\/\//i.test(s)){const a=document.createElement('a');a.href=s;a.textContent=s;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}else p.textContent=s;$('source-list').append(p);}
$('study-tab').onclick=()=>switchMode('study');$('list-tab').onclick=()=>switchMode('list');$('search').oninput=list;$('filter').onchange=rebuild;$('reveal').onclick=reveal;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('known').onclick=()=>rate('known');$('again').onclick=()=>rate('again');
$('shuffle').onclick=()=>{for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}index=0;render();};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){notify('当前浏览器不支持朗读，翻卡和复习仍可使用。');return;}const c=queue[index];if(!c)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c.sentence);u.lang='en-US';u.rate=.85;u.onerror=()=>notify('朗读暂不可用，请检查设备语音或网络。');speechSynthesis.speak(u);};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,deck_id:D.deck_id,progress},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='vocab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('已导出学习进度。');};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const obj=JSON.parse(await f.text());if(obj.version!==1||obj.deck_id!==D.deck_id)throw Error('这份进度不属于当前词汇页');const p=cleanProgress(obj.progress);if(!confirm('导入会替换当前学习进度，继续吗？'))return;progress=p;save();rebuild();list();notify('进度已导入。');}catch(e){notify('导入失败：'+e.message);}finally{$('file').value='';}};
$('reset').onclick=()=>{if(!confirm('确定清除这一集的学习进度吗？'))return;progress={};save();rebuild();list();notify('已重置本集进度。');};
document.addEventListener('keydown',e=>{if(mode!=='study'||e.ctrlKey||e.metaKey||e.altKey||e.repeat||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;if(e.key===' '){e.preventDefault();reveal();}if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='1')rate('again');if(e.key==='2')rate('known');});
rebuild();
</script></body></html>
